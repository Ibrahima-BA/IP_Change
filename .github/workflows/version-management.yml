name: Version Management & Auto-Release

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/**'
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Type de version (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      pre_release:
        description: 'Version de pré-release (alpha, beta, rc) ou vide pour stable'
        required: false
        type: string

env:
  PROJECT_NAME: "IP_Change"

jobs:
  # ===============================================================================
  # JOB 1: Détection des changements et calcul de version
  # ===============================================================================
  version-detection:
    name: Détection et Calcul de Version
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.changes.outputs.should_release }}
      version_type: ${{ steps.changes.outputs.version_type }}
      new_version: ${{ steps.version.outputs.new_version }}
      current_version: ${{ steps.version.outputs.current_version }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    
    steps:
    - name: 📥 Checkout du code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: 🔍 Analyse des changements
      id: changes
      run: |
        echo "Analyse des changements depuis le dernier commit..."
        
        # Si déclenché manuellement, utiliser les paramètres
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "should_release=true" >> $GITHUB_OUTPUT
          echo "version_type=${{ github.event.inputs.version_type }}" >> $GITHUB_OUTPUT
          echo "🎯 Release manuelle demandée: ${{ github.event.inputs.version_type }}"
          exit 0
        fi
        
        # Vérifier les changements depuis le dernier tag
        LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
        echo "Dernier tag: $LAST_TAG"
        
        # Analyser les messages de commit
        COMMITS=$(git log "$LAST_TAG"..HEAD --pretty=format:"%s" | tr '[:upper:]' '[:lower:]')
        
        if [ -z "$COMMITS" ]; then
          echo "should_release=false" >> $GITHUB_OUTPUT
          echo "Aucun changement depuis le dernier tag"
          exit 0
        fi
        
        echo "Commits analysés:"
        echo "$COMMITS"
        
        # Déterminer le type de version basé sur les mots-clés
        VERSION_TYPE="patch"
        
        if echo "$COMMITS" | grep -qE "(breaking|major|incompatible|!:)"; then
          VERSION_TYPE="major"
        elif echo "$COMMITS" | grep -qE "(feat|feature|minor|add|new)"; then
          VERSION_TYPE="minor"
        elif echo "$COMMITS" | grep -qE "(fix|patch|bug|hotfix|update|improve)"; then
          VERSION_TYPE="patch"
        fi
        
        # Vérifier s'il y a des changements significatifs
        if echo "$COMMITS" | grep -qE "(version|release|feat|fix|breaking|major|minor|patch)"; then
          echo "should_release=true" >> $GITHUB_OUTPUT
          echo "version_type=$VERSION_TYPE" >> $GITHUB_OUTPUT
          echo "✅ Release automatique détectée: $VERSION_TYPE"
        else
          echo "should_release=false" >> $GITHUB_OUTPUT
          echo "❌ Pas de changements significatifs détectés"
        fi
    
    - name: 🔢 Calcul de la nouvelle version
      id: version
      if: steps.changes.outputs.should_release == 'true'
      run: |
        # Récupérer la version actuelle
        CURRENT_VERSION=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo "0.0.0")
        echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
        echo "Version actuelle: $CURRENT_VERSION"
        
        # Séparer les composants de version
        IFS='.' read -ra VERSION_PARTS <<< "$CURRENT_VERSION"
        MAJOR=${VERSION_PARTS[0]:-0}
        MINOR=${VERSION_PARTS[1]:-0}
        PATCH=${VERSION_PARTS[2]:-0}
        
        # Calculer la nouvelle version
        VERSION_TYPE="${{ steps.changes.outputs.version_type }}"
        
        case $VERSION_TYPE in
          major)
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
            ;;
          minor)
            MINOR=$((MINOR + 1))
            PATCH=0
            ;;
          patch)
            PATCH=$((PATCH + 1))
            ;;
        esac
        
        NEW_VERSION="$MAJOR.$MINOR.$PATCH"
        
        # Ajouter le suffixe de pré-release si spécifié
        if [ -n "${{ github.event.inputs.pre_release }}" ]; then
          NEW_VERSION="$NEW_VERSION-${{ github.event.inputs.pre_release }}"
        fi
        
        echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
        echo "🚀 Nouvelle version: $NEW_VERSION"
    
    - name: 📋 Génération du changelog
      id: changelog
      if: steps.changes.outputs.should_release == 'true'
      run: |
        CURRENT_VERSION="${{ steps.version.outputs.current_version }}"
        NEW_VERSION="${{ steps.version.outputs.new_version }}"
        
        echo "Génération du changelog pour v$NEW_VERSION..."
        
        # Récupérer les commits depuis le dernier tag
        if [ "$CURRENT_VERSION" != "0.0.0" ]; then
          COMMITS=$(git log "v$CURRENT_VERSION"..HEAD --pretty=format:"- %s (%h)" --reverse)
        else
          COMMITS=$(git log --pretty=format:"- %s (%h)" --reverse --max-count=20)
        fi
        
        # Catégoriser les commits
        FEATURES=""
        FIXES=""
        IMPROVEMENTS=""
        OTHERS=""
        
        while IFS= read -r commit; do
          if echo "$commit" | grep -qiE "(feat|feature|add|new)"; then
            FEATURES="$FEATURES"$'\n'"$commit"
          elif echo "$commit" | grep -qiE "(fix|bug|hotfix)"; then
            FIXES="$FIXES"$'\n'"$commit"
          elif echo "$commit" | grep -qiE "(improve|update|enhance|refactor)"; then
            IMPROVEMENTS="$IMPROVEMENTS"$'\n'"$commit"
          else
            OTHERS="$OTHERS"$'\n'"$commit"
          fi
        done <<< "$COMMITS"
        
        # Construire le changelog
        CHANGELOG="## 🚀 Version $NEW_VERSION\n\n"
        
        if [ -n "$FEATURES" ]; then
          CHANGELOG="$CHANGELOG### ✨ Nouvelles fonctionnalités\n$FEATURES\n\n"
        fi
        
        if [ -n "$FIXES" ]; then
          CHANGELOG="$CHANGELOG### 🐛 Corrections de bugs\n$FIXES\n\n"
        fi
        
        if [ -n "$IMPROVEMENTS" ]; then
          CHANGELOG="$CHANGELOG### 🔧 Améliorations\n$IMPROVEMENTS\n\n"
        fi
        
        if [ -n "$OTHERS" ]; then
          CHANGELOG="$CHANGELOG### 📝 Autres changements\n$OTHERS\n\n"
        fi
        
        CHANGELOG="$CHANGELOG### 📊 Statistiques\n"
        CHANGELOG="$CHANGELOG- Scripts mis à jour: $(git diff --name-only "v$CURRENT_VERSION"..HEAD scripts/ | wc -l || echo "N/A")\n"
        CHANGELOG="$CHANGELOG- Documentation mise à jour: $(git diff --name-only "v$CURRENT_VERSION"..HEAD docs/ README.md | wc -l || echo "N/A")\n"
        CHANGELOG="$CHANGELOG- Commits inclus: $(echo "$COMMITS" | wc -l)\n\n"
        
        CHANGELOG="$CHANGELOG### 🔗 Installation\n"
        CHANGELOG="$CHANGELOG1. Téléchargez les assets de cette release\n"
        CHANGELOG="$CHANGELOG2. Extrayez l'archive dans votre dossier de choix\n"
        CHANGELOG="$CHANGELOG3. Consultez le README.md pour les instructions\n"
        
        # Échapper pour GitHub Actions
        {
          echo "changelog<<EOF"
          echo -e "$CHANGELOG"
          echo "EOF"
        } >> $GITHUB_OUTPUT

  # ===============================================================================
  # JOB 2: Mise à jour des versions dans les fichiers
  # ===============================================================================
  update-versions:
    name: Mise à jour des versions
    runs-on: ubuntu-latest
    needs: version-detection
    if: needs.version-detection.outputs.should_release == 'true'
    
    steps:
    - name: 📥 Checkout du code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: 🔄 Mise à jour des fichiers de version
      run: |
        NEW_VERSION="${{ needs.version-detection.outputs.new_version }}"
        echo "Mise à jour vers la version: $NEW_VERSION"
        
        # Mise à jour du script Windows (.bat)
        if [ -f "scripts/ip_config.bat" ]; then
          sed -i "s/SET VERSION=.*/SET VERSION=$NEW_VERSION/" scripts/ip_config.bat
          sed -i "s/:: Version: .*/:: Version: $NEW_VERSION/" scripts/ip_config.bat
          echo "✅ Version mise à jour dans ip_config.bat"
        fi
        
        # Mise à jour du script Python
        if [ -f "scripts/script_IPchange.py" ]; then
          sed -i "s/'version': '[^']*'/'version': '$NEW_VERSION'/" scripts/script_IPchange.py
          sed -i "s/Version: [0-9.]*/Version: $NEW_VERSION/" scripts/script_IPchange.py
          echo "✅ Version mise à jour dans script_IPchange.py"
        fi
        
        # Mise à jour du script Shell
        if [ -f "scripts/script_IPchange.sh" ]; then
          sed -i "s/VERSION=\"[^\"]*\"/VERSION=\"$NEW_VERSION\"/" scripts/script_IPchange.sh
          sed -i "s/# Version: [0-9.]*/# Version: $NEW_VERSION/" scripts/script_IPchange.sh
          echo "✅ Version mise à jour dans script_IPchange.sh"
        fi
        
        # Mise à jour du README.md
        if [ -f "README.md" ]; then
          sed -i "s/version-[0-9.]*-blue/version-$NEW_VERSION-blue/" README.md
          sed -i "s/Version.*: [0-9.]*/Version**: $NEW_VERSION/" README.md
          echo "✅ Version mise à jour dans README.md"
        fi
        
        # Vérifier les changements
        git diff --name-only
    
    - name: 💾 Commit des changements de version
      run: |
        NEW_VERSION="${{ needs.version-detection.outputs.new_version }}"
        
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        git add -A
        git commit -m "🔖 Bump version to v$NEW_VERSION

        - Mise à jour automatique des numéros de version
        - Scripts Windows, Python et Shell mis à jour
        - Documentation mise à jour
        
        [skip ci]" || echo "Aucun changement à committer"
        
        git push origin main

  # ===============================================================================
  # JOB 3: Création du tag et release
  # ===============================================================================
  create-tag:
    name: Création du tag et release
    runs-on: ubuntu-latest
    needs: [version-detection, update-versions]
    if: needs.version-detection.outputs.should_release == 'true'
    
    steps:
    - name: 📥 Checkout du code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        ref: main
    
    - name: 🏷️ Création du tag
      run: |
        NEW_VERSION="${{ needs.version-detection.outputs.new_version }}"
        
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # Créer le tag annoté
        git tag -a "v$NEW_VERSION" -m "🚀 Release v$NEW_VERSION

        Version automatique générée par GitHub Actions
        
        Type de version: ${{ needs.version-detection.outputs.version_type }}
        Version précédente: v${{ needs.version-detection.outputs.current_version }}
        
        Cette release inclut:
        - Scripts de configuration réseau améliorés
        - Interface colorée et logging avancé
        - Support multiplateforme (Windows/macOS/Linux)
        - Mode verbose et tests de connectivité
        - Documentation mise à jour
        
        Voir le changelog complet dans les notes de release."
        
        # Pousser le tag
        git push origin "v$NEW_VERSION"
        
        echo "✅ Tag v$NEW_VERSION créé et poussé"
    
    - name: 📋 Préparation des notes de release
      run: |
        NEW_VERSION="${{ needs.version-detection.outputs.new_version }}"
        
        # Créer le fichier de notes de release
        cat > RELEASE_NOTES.md << 'EOF'
        ${{ needs.version-detection.outputs.changelog }}
        EOF
        
        echo "Notes de release préparées pour v$NEW_VERSION"

  # ===============================================================================
  # JOB 4: Validation post-release
  # ===============================================================================
  post-release-validation:
    name: Validation post-release
    runs-on: ubuntu-latest
    needs: [version-detection, create-tag]
    if: needs.version-detection.outputs.should_release == 'true'
    
    steps:
    - name: 📥 Checkout du code
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0
    
    - name: ✅ Vérification du tag créé
      run: |
        NEW_VERSION="${{ needs.version-detection.outputs.new_version }}"
        
        # Vérifier que le tag existe
        if git tag -l | grep -q "v$NEW_VERSION"; then
          echo "✅ Tag v$NEW_VERSION trouvé"
        else
          echo "❌ Tag v$NEW_VERSION non trouvé"
          exit 1
        fi
        
        # Vérifier les informations du tag
        git show "v$NEW_VERSION" --format=full --no-patch
    
    - name: 📊 Statistiques de la release
      run: |
        NEW_VERSION="${{ needs.version-detection.outputs.new_version }}"
        CURRENT_VERSION="${{ needs.version-detection.outputs.current_version }}"
        
        echo "=== 📊 STATISTIQUES DE RELEASE ==="
        echo "Version précédente: v$CURRENT_VERSION"
        echo "Nouvelle version: v$NEW_VERSION"
        echo "Type de release: ${{ needs.version-detection.outputs.version_type }}"
        echo ""
        
        echo "=== 📁 FICHIERS MODIFIÉS ==="
        if [ "$CURRENT_VERSION" != "0.0.0" ]; then
          git diff --name-status "v$CURRENT_VERSION"..HEAD | head -20
        else
          echo "Premier release - tous les fichiers sont nouveaux"
        fi
        echo ""
        
        echo "=== 🏷️ TAGS DISPONIBLES ==="
        git tag -l --sort=-version:refname | head -10
    
    - name: 🎉 Message de succès
      run: |
        NEW_VERSION="${{ needs.version-detection.outputs.new_version }}"
        
        echo "🎉 RELEASE v$NEW_VERSION CRÉÉE AVEC SUCCÈS !"
        echo ""
        echo "La release v$NEW_VERSION a été créée automatiquement."
        echo "Le workflow CI/CD principal se chargera de:"
        echo "- Créer les packages de distribution"
        echo "- Générer les checksums"
        echo "- Publier la GitHub Release"
        echo "- Effectuer les tests multi-plateforme"
        echo ""
        echo "🔗 Suivez les autres workflows pour le statut complet."
